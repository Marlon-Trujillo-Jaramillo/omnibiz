version: 2
# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
updates:
  - package-ecosystem: pub
    directory: /inventario_app
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]
    # Major versions of libraries are planned on purpose (breaking changes), not merged weekly.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
