version: 2
# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
updates:
  - package-ecosystem: pub
    directory: /inventario_app
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
